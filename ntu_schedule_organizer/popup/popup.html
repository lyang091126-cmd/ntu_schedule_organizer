<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTU Learn 智能日程与 DDL 整理助手</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header Area -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="M8 14h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M16 14h.01"></path>
            <path d="M8 18h.01"></path>
            <path d="M12 18h.01"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>NTU Learn 日程助手</h1>
          <span class="sub-text" id="sync-status">最近更新: 准备中...</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-sync" class="btn btn-secondary" title="刷新/与 NTU Learn 同步数据">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          刷新同步
        </button>
        <button id="btn-export-ical" class="btn btn-primary" title="导出到系统日历 (.ics)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          导出日历
        </button>
      </div>
    </header>

    <!-- Urgency Overview Cards -->
    <section class="urgency-radar">
      <div class="radar-card urgent-red">
        <div class="card-header">
          <span class="pulse-indicator red"></span>
          <h2>24 小时内截止 (紧急)</h2>
        </div>
        <div class="card-count" id="count-24h">0</div>
        <div class="card-desc">需优先处理并提交</div>
      </div>

      <div class="radar-card urgent-yellow">
        <div class="card-header">
          <span class="pulse-indicator yellow"></span>
          <h2>3 天内截止 (预警)</h2>
        </div>
        <div class="card-count" id="count-3d">0</div>
        <div class="card-desc">建议安排规划</div>
      </div>

      <div class="radar-card urgent-blue">
        <div class="card-header">
          <span class="pulse-indicator blue"></span>
          <h2>本周 / 后续任务</h2>
        </div>
        <div class="card-count" id="count-week">0</div>
        <div class="card-desc">正常进度进行中</div>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <div class="controls-bar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="搜索课程名称或作业关键事件...">
      </div>

      <div class="filter-group">
        <select id="filter-course">
          <option value="ALL">全部课程 (All Courses)</option>
        </select>

        <select id="filter-type">
          <option value="ALL">全部类型 (All Types)</option>
          <option value="assignment">📝 课后作业 (Assignments)</option>
          <option value="quiz">⏱️ 测验考试 (Quizzes)</option>
          <option value="discussion_topic">💬 讨论组/公告 (Discussions)</option>
        </select>

        <button id="btn-load-demo" class="btn-ghost" title="如果未登录网页，加载测试样例数据">
          加载样例日程
        </button>
      </div>
    </div>

    <!-- Main Task Schedule List -->
    <main class="schedule-section">
      <div class="section-title">
        <h3>我需要做什么与 DDL 整理</h3>
        <span class="badge-pill" id="total-badge">共 0 项</span>
      </div>

      <div id="schedule-list" class="schedule-list">
        <!-- Rendered dynamically -->
      </div>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🎉</div>
        <h4>暂无待办事项或无匹配任务</h4>
        <p>打开 <a href="https://ntulearn.ntu.edu.sg" target="_blank" class="link">ntulearn.ntu.edu.sg</a> 点击【⚡ 智能日程整理】按钮自动抓取最新 DDL！</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>NTU Schedule Organizer • 专为 NTU 学子打造</span>
      <span class="privacy-note">🔒 数据仅存在本地浏览器，安全无外传</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
